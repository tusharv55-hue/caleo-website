Paste this in place of your current HERO section
========================= -->

<section class="hero">

  <!-- CINEMATIC VIDEO -->
  <video class="hero-video" autoplay muted loop playsinline>
    <source src="videos/caleo-hero.mp4" type="video/mp4">
  </video>

  <!-- OVERLAY -->
  <div class="hero-overlay"></div>

  <!-- LIGHT GLOW -->
  <div class="hero-glow"></div>

  <!-- CONTENT -->
  <div class="hero-content fade-up">

    <div class="hero-eyebrow">
      Launching 2026 — India
    </div>

    <h1 class="hero-title">
      Crafted for the<br>
      <em>gentlest skin</em><br>
      in the world.
    </h1>

    <p class="hero-sub">
      Botanical baby care made with warmth,
      ritual and uncompromising safety.
    </p>

    <a href="#waitlist" class="hero-cta">
      Discover Caleo
      <span class="hero-cta-arrow">→</span>
    </a>

  </div>

  <!-- SCROLL INDICATOR -->
  <div class="hero-scroll">
    <span></span>
  </div>

</section>

<style>

/* =========================
CINEMATIC HERO
========================= */

.hero{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:#000;
}

/* VIDEO */

.hero-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;

  filter:
    brightness(.72)
    saturate(.9)
    contrast(1.02);

  transform:scale(1.04);
}

/* OVERLAY */

.hero-overlay{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to top,
      rgba(10,7,5,.88) 0%,
      rgba(10,7,5,.45) 30%,
      rgba(10,7,5,.18) 60%,
      rgba(10,7,5,.08) 100%
    );

  z-index:2;
}

/* SOFT GLOW */

.hero-glow{
  position:absolute;
  width:700px;
  height:700px;

  top:50%;
  left:55%;

  transform:translate(-50%,-50%);

  background:
    radial-gradient(
      circle,
      rgba(212,164,106,.22) 0%,
      rgba(212,164,106,.08) 40%,
      transparent 70%
    );

  z-index:2;
}

/* CONTENT */

.hero-content{
  position:absolute;
  bottom:90px;
  left:64px;
  z-index:5;
  max-width:620px;
}

/* EYEBROW */

.hero-eyebrow{
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;

  color:rgba(245,240,232,.62);

  margin-bottom:18px;

  font-family:'Jost',sans-serif;
}

/* TITLE */

.hero-title{
  font-family:'Cormorant Garamond',serif;
  font-size:72px;
  line-height:1.02;
  font-weight:300;

  color:#F5F0E8;

  margin-bottom:24px;
}

.hero-title em{
  font-style:italic;
  color:#D7B17B;
}

/* SUBTEXT */

.hero-sub{
  font-family:'Jost',sans-serif;
  font-size:15px;
  line-height:1.9;

  color:rgba(245,240,232,.72);

  max-width:500px;

  margin-bottom:36px;

  font-weight:300;
}

/* CTA */

.hero-cta{
  display:inline-flex;
  align-items:center;
  gap:12px;

  padding:15px 34px;

  border:
    1px solid rgba(245,240,232,.24);

  text-decoration:none;

  color:#F5F0E8;

  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;

  font-family:'Jost',sans-serif;

  backdrop-filter:blur(10px);

  transition:
    background .35s ease,
    transform .35s ease,
    border-color .35s ease;
}

.hero-cta:hover{
  background:rgba(245,240,232,.08);

  transform:translateY(-2px);

  border-color:
    rgba(245,240,232,.4);
}

.hero-cta-arrow{
  font-size:16px;
}

/* SCROLL INDICATOR */

.hero-scroll{
  position:absolute;
  left:50%;
  bottom:24px;

  transform:translateX(-50%);

  z-index:5;
}

.hero-scroll span{
  display:block;

  width:1px;
  height:60px;

  background:
    linear-gradient(
      to bottom,
      rgba(245,240,232,.6),
      transparent
    );

  animation:scrollLine 2s infinite;
}

@keyframes scrollLine{

  0%{
    opacity:0;
    transform:translateY(-10px);
  }

  50%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:translateY(10px);
  }
}

/* =========================
SCROLL ANIMATION
========================= */

.fade-up{
  opacity:0;
  transform:translateY(40px);

  transition:
    opacity 1.2s ease,
    transform 1.2s ease;
}

.fade-up.show{
  opacity:1;
  transform:translateY(0);
}

/* =========================
PRODUCT HOVER
========================= */

.prod-item{
  transition:
    transform .5s ease,
    box-shadow .5s ease;
}

.prod-item:hover{
  transform:translateY(-10px);

  box-shadow:
    0 20px 50px rgba(0,0,0,.08);
}

/* =========================
IMAGE ZOOM
========================= */

.prod-img-wrap img,
.cat-img img,
.read-img img{
  transition:
    transform 1.2s ease;
}

.prod-item:hover img,
.cat-item:hover img,
.read-item:hover img{
  transform:scale(1.06);
}

/* =========================
SMOOTH SCROLL
========================= */

html{
  scroll-behavior:smooth;
}

/* =========================
MOBILE
========================= */

@media(max-width:768px){

  .hero{
    height:100svh;
  }

  .hero-content{
    left:28px;
    right:28px;
    bottom:56px;
  }

  .hero-title{
    font-size:48px;
  }

  .hero-sub{
    font-size:14px;
    line-height:1.8;
  }

  .hero-cta{
    width:100%;
    justify-content:center;
  }

  .hero-glow{
    width:420px;
    height:420px;
  }

}

</style>

<script>

/* =========================
FADE UP ON SCROLL
========================= */

const observer = new IntersectionObserver((entries)=>{

  entries.forEach(entry=>{

    if(entry.isIntersecting){
      entry.target.classList.add('show');
    }

  });

},{
  threshold:0.15
});

document.querySelectorAll('.fade-up').forEach(el=>{
  observer.observe(el);
});

/* =========================
PARALLAX HERO
========================= */

window.addEventListener('scroll',()=>{

  const scrolled = window.pageYOffset;

  const heroVideo =
    document.querySelector('.hero-video');

  if(heroVideo){

    heroVideo.style.transform =
      `scale(1.04) translateY(${scrolled * 0.12}px)`;

  }

});

</script>
